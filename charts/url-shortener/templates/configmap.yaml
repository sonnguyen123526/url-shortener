apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.fullname" . }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    {{- include "url-shortener.selectorLabels" . | nindent 4 }}
data:
  # The Redis Service name; cluster DNS resolves it to the Redis pod.
  REDIS_ADDR: {{ printf "%s:6379" (include "url-shortener.redisName" .) | quote }}
  BASE_URL: {{ .Values.baseURL | quote }}
