{{- if not .Values.redis.auth.existingSecret }}
{{- $name := include "url-shortener.redisSecretName" . }}
{{- $password := .Values.redis.auth.password }}
{{- if not $password }}
{{- /* Reuse the password from a previous install so `helm upgrade` doesn't rotate it. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    {{- include "url-shortener.redisSelectorLabels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
