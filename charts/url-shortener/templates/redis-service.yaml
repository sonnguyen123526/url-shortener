# Headless Service (no cluster IP): required by the StatefulSet, and gives the
# Redis pod a stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "url-shortener.redisName" . }}
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
    {{- include "url-shortener.redisSelectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "url-shortener.redisSelectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
