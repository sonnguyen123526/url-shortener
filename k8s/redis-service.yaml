# Headless Service (no cluster IP): required by the StatefulSet, and gives each
# Redis pod a stable DNS name. The app connects to "redis:6379".
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
